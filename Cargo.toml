[workspace]
resolver = "2"
members = ["crates/*", "spikes/*"]

# AGPL-3.0 双许可：≤30 并发用户免费商用；更大规模商业部署联系作者获取商业许可
[workspace.package]
license = "AGPL-3.0-or-later"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util", "signal"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
thiserror = "2"
async-trait = "0.1"
arc-swap = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
axum = { version = "0.8", features = ["multipart"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
figment = { version = "0.10", features = ["env"] }
utoipa = { version = "5", features = ["axum_extras", "uuid"] }
jsonwebtoken = "9"
casbin = { version = "2", default-features = false, features = ["runtime-tokio"] }
argon2 = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }

[profile.release]
opt-level = 3
lto = "thin"
