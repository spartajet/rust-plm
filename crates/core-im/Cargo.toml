[package]
name = "core-im"
version = "0.1.0"
edition = "2021"
description = "RustPLM IM 集成：审批卡片渲染/机器人 webhook 推送/统一回调契约（钉钉/企微/飞书）"

[dependencies]
tokio = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
core-model = { path = "../core-model" }

[dev-dependencies]
mod-doc = { path = "../mod-doc" }
core-files = { path = "../core-files" }
core-version = { path = "../core-version" }
core-events = { path = "../core-events" }
axum = { workspace = true }
tower = { version = "0.5", features = ["util"] }
